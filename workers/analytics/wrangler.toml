name = "chinapte-analytics"
main = "src/index.js"
compatibility_date = "2024-09-01"

# After creating the KV namespace in Cloudflare dashboard:
#   npx wrangler kv namespace create CHINAPTE_ANALYTICS
# paste the id below, then:
#   npx wrangler deploy
# Route (Workers Routes or Custom Domain): chinapte.net/api/analytics*

[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[vars]
# Set ADMIN_KEY as a secret in production:
#   npx wrangler secret put ADMIN_KEY
