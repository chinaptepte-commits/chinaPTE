<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Laboratory Distillation Apparatus">
  <rect width="720" height="420" fill="#f8fafc" rx="8"/>
  <rect x="8" y="8" width="704" height="404" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>
<text x="360.0" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Laboratory Distillation Apparatus</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<ellipse cx="180" cy="280" rx="60" ry="50" fill="#dbeafe" stroke="#3d6fd9" stroke-width="2"/>
<rect x="165" y="180" width="30" height="100" fill="#dbeafe" stroke="#3d6fd9" stroke-width="2"/>
<rect x="150" y="320" width="60" height="20" fill="#e85d5d" rx="2"/>
<text x="180" y="360" text-anchor="middle" font-size="12" fill="#e85d5d" font-family="Segoe UI,Arial,sans-serif">Heat</text>
<text x="180" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif">Flask</text>
<rect x="220" y="160" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#06b6d4" stroke-width="2"/>
<text x="320" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif">Condenser</text>
<path d="M195 180 L220 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<path d="M420 180 L460 180 L460 240" stroke="#94a3b8" stroke-width="2" fill="none"/>
<ellipse cx="460" cy="290" rx="45" ry="40" fill="#dcfce7" stroke="#1a9f63" stroke-width="2"/>
<text x="460" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif">Receiver</text>
<text x="460" y="350" text-anchor="middle" font-size="12" fill="#64748b" font-family="Segoe UI,Arial,sans-serif">Distillate</text>
<text x="360.0" y="390" text-anchor="middle" font-size="12" fill="#64748b" font-family="Segoe UI,Arial,sans-serif">Vapour → cool → liquid product</text>
