<circle cx="360.0" cy="120.0" r="42" fill="#06b6d4" opacity="0.9"/>
<text x="360.0" y="114.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Arial,sans-serif">Atmosphere</text>
