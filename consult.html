    <div class="consult-layout">
      <div class="wechat-box">

  <script>
    (async function () {
      function setText(id, value) {
        if (value == null || value === "") return;
        var node = document.getElementById(id);
        if (node) node.textContent = value;
      }
      function setAttr(id, attr, value) {
        if (value == null || value === "") return;
        var node = document.getElementById(id);
        if (node) node.setAttribute(attr, value);
      }
      try {
        var res = await fetch("content/consult.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        var data = await res.json();
        if (data.pageTitle) document.title = data.pageTitle;
        setText("c_brandName", data.brandName);
        setText("c_brandSub", data.brandSub);
        setText("c_introTitle", data.introTitle);
        setText("c_intro", data.intro);
        setText("c_disclaimerShort", data.disclaimerShort);
        setText("c_wechatLabel", data.wechatLabel);
        setText("wechatId", data.wechatId);
        setText("btnCopyWx", data.copyWechatBtn);
        setText("c_nameLabel", data.nameLabel);
        setAttr("leadName", "placeholder", data.namePlaceholder);
        setText("c_contactLabel", data.contactLabel);
        setAttr("leadContact", "placeholder", data.contactPlaceholder);
        setText("c_countryLabel", data.countryLabel);
        setAttr("leadCountry", "placeholder", data.countryPlaceholder);
        setText("c_noteLabel", data.noteLabel);
        setAttr("leadNote", "placeholder", data.notePlaceholder);
        setText("c_submitText", data.submitText);
        setText("c_successTitle", data.successTitle);
        setText("successDetail", data.successDetail);
        setText("c_formNote", data.formNote);
        if (data.ctaPracticeText) setText("c_ctaPractice", data.ctaPracticeText);
        if (data.ctaPracticeHref) setAttr("c_ctaPractice", "href", data.ctaPracticeHref);
        if (data.ctaLaborText) setText("c_ctaLabor", data.ctaLaborText);
        if (data.ctaLaborHref) setAttr("c_ctaLabor", "href", data.ctaLaborHref);
        setText("c_disclaimerFooter", data.disclaimerFooter);
        setText("c_footer", data.footer);
        if (Array.isArray(data.countryOptions) && data.countryOptions.length) {
          var dl = document.getElementById("countryHints");
          if (dl) {
            dl.innerHTML = data.countryOptions.map(function (opt) {
              return '<option value="' + String(opt).replace(/"/g, "&quot;") + '"></option>';
            }).join("");
          }
        }
      } catch (err) {
        console.warn("consult.json load failed, using static fallback", err);
      }
    })();
  </script>
